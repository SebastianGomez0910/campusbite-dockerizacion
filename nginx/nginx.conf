
events {
    worker_connections 1024;
}

http {
    # DNS interno de Docker para resolver dinámicamente las réplicas de api_pedidos
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        # Health Check de API Pedidos
        location = /health {
            set $api_upstream http://api_pedidos:5000;
            proxy_pass $api_upstream/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API REST de Pedidos (Balanceo automático entre réplicas)
        location /pedidos {
            set $api_upstream http://api_pedidos:5000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Servidor WebSocket de Notificaciones
        location /ws {
            set $ws_upstream http://ms_notificaciones:8765;
            proxy_pass $ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
