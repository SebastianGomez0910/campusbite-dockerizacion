services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: campusbite_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend_net

  api_pedidos:
    build:
      context: ./api
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      TOPICO_PEDIDO_CREADO: ${TOPICO_PEDIDO_CREADO}
      TOPICO_PEDIDO_LISTO: ${TOPICO_PEDIDO_LISTO}
      API_INTERNAL_PORT: ${API_INTERNAL_PORT}
    deploy:
      replicas: ${API_REPLICAS}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend_net

  ms_caja:
    build:
      context: ./caja
    container_name: campusbite_caja
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      TOPICO_PEDIDO_CREADO: ${TOPICO_PEDIDO_CREADO}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend_net

  ms_cocina:
    build:
      context: ./cocina
    container_name: campusbite_cocina
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      TOPICO_PEDIDO_CREADO: ${TOPICO_PEDIDO_CREADO}
      TOPICO_PEDIDO_LISTO: ${TOPICO_PEDIDO_LISTO}
      COCINA_INTERNAL_PORT: ${COCINA_INTERNAL_PORT}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend_net

  ms_estadisticas:
    build:
      context: ./estadisticas
    container_name: campusbite_estadisticas
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      TOPICO_PEDIDO_CREADO: ${TOPICO_PEDIDO_CREADO}
      ESTADISTICAS_INTERNAL_PORT: ${ESTADISTICAS_INTERNAL_PORT}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend_net

  ms_facturacion:
    build:
      context: ./facturacion
    container_name: campusbite_facturacion
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      TOPICO_PEDIDO_CREADO: ${TOPICO_PEDIDO_CREADO}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend_net

  ms_notificaciones:
    build:
      context: ./notificaciones
    container_name: campusbite_notificaciones
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER}
      TOPICO_PEDIDO_LISTO: ${TOPICO_PEDIDO_LISTO}
      WS_INTERNAL_PORT: ${WS_INTERNAL_PORT}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend_net

  nginx:
    image: nginx:1.27-alpine
    container_name: campusbite_proxy
    ports:
      - "${PROXY_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api_pedidos
      - ms_cocina
      - ms_estadisticas
      - ms_notificaciones
    restart: unless-stopped
    networks:
      - frontend_net
      - backend_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true